<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA MOD</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">


<style>

:root{
--bg:#06060b;
--panel:#0d0d14;
--line:#292231;
--text:#f8f7fb;
--muted:#aaa3b5;
--accent:#ffd23f;
--accent2:#8b6cff;
--shadow:0 24px 70px rgba(0,0,0,.55);
}


*{
box-sizing:border-box;
}


body{

margin:0;
font-family:"Vazirmatn",Tahoma,Arial,sans-serif;

background:
radial-gradient(circle at 50% -10%,rgba(255,210,63,.12),transparent 30%),
radial-gradient(circle at 100% 40%,rgba(139,108,255,.15),transparent 35%),
linear-gradient(180deg,#050509,#090911,#06060b);

color:var(--text);
min-height:100vh;

}


.page{

max-width:900px;
margin:auto;
padding:30px 18px 60px;

}


.card{

background:
linear-gradient(180deg,#0e0e15,#08080e);

border:1px solid #29252f;

border-radius:30px;

box-shadow:var(--shadow);

overflow:hidden;

}


.game-card{

margin-bottom:70px;

}



.hero{

padding:45px 25px 25px;
text-align:center;

}



.hero img{

width:150px;
height:150px;

object-fit:cover;

border-radius:32px;

display:block;

margin:0 auto 22px;

border:2px solid rgba(255,210,63,.45);

box-shadow:0 0 30px rgba(255,210,63,.25);

}



.pill{

display:inline-block;

padding:10px 22px;

border-radius:999px;

background:
linear-gradient(180deg,#1a1716,#121114);

border:1px solid #44382b;

color:#ffd65a;

font-weight:900;

font-size:18px;

box-shadow:
0 0 20px rgba(255,210,63,.12);

}



.content{

padding:0 34px 35px;

}



.features{

background:
linear-gradient(180deg,#0a0a10,#08080e);

border:1px solid #201d29;

border-radius:26px;

padding:24px;

}



.features h2{

margin:0 0 22px;

color:#ffd65a;

font-size:24px;

font-weight:900;

text-align:right;

}



.item{

display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

padding:20px;

border-radius:20px;

background:#111119;

border:1px solid #25222e;

}



.name{

font-size:22px;

font-weight:800;

}



.emoji{

font-size:32px;

}



.buttons{

display:grid;

gap:16px;

margin-top:28px;

}



.btn{

text-decoration:none;

text-align:center;

padding:18px;

border-radius:18px;

font-size:21px;

font-weight:900;

transition:.25s;

}



.btn:hover{

transform:translateY(-3px);

}



.primary{

background:
linear-gradient(135deg,#ffd23f,#ffb429);

color:#17120a;

}



.secondary{

background:
linear-gradient(135deg,#735cff,#9a72ff);

color:white;

}



.footer{

padding:24px;

text-align:center;

color:var(--muted);

font-size:14px;

border-top:1px solid #17324b;

}



@media(max-width:600px){

.content{

padding:0 16px 25px;

}


.name{

font-size:18px;

}


.btn{

font-size:18px;

}

}


</style>

</head>


<body>


<div class="page">


<section class="card game-card">


<div class="hero">


<img src="https://uploadkon.ir/uploads/be6801_26file-00000000fd408246a6593a107533ea58.png" 
alt="آیکون چیت سلطان">


<div class="pill">
💛 چیت سلطان حکم 💛
</div>


</div>



<div class="content">


<section class="features">


<h2>
🌸 قابلیت ها :
</h2>



<div class="item">

<div class="name">
دیدن کارت بازیکن های حریف
</div>

<div class="emoji">
🃏
</div>

</div>




<div class="buttons">



<a class="btn primary"
href="https://uploadkon.ir/uploads/133327_26سلطان-حکم-1-11.zip"
target="_blank">

💜 دانلود چیت

</a>




<a class="btn secondary"
href="https://uploadkon.ir/uploads/8a8131_26InShot-20260831-172558657.mp4"
target="_blank"
download>

🎥 دریافت ویدیو یِ آموزشی

</a>




<a class="btn secondary"
href="https://rubika.ir/NOVA_CHIT"
target="_blank">

📢 چنل سازنده

</a>



</div>


</section>


</div>




<div class="footer">

رایگان • بدون بن شدن • جدید ترین نسخه

</div>



</section>


</div>


</body>
</html>
