<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="NOVA MOD — مرکز اختصاصی مود و ابزارهای گیمینگ">
<meta name="theme-color" content="#08080f">
<meta name="color-scheme" content="dark">
<title>NOVA MOD | مرکز اختصاصی مود و ابزارهای گیمینگ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💜%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
<style>
  :root {
    --bg: #05050a;
    --panel: #0d0d16;
    --panel-2: #111119;
    --line: #241f30;
    --line-soft: #1a1622;
    --text: #f6f4fb;
    --muted: #a49db5;
    --gold: #ffd23f;
    --gold-2: #ffb429;
    --neon: #8b6cff;
    --neon-2: #a98bff;
    --green: #35e08a;
    --red: #ff5577;
    --radius: 24px;
    --radius-sm: 16px;
    --shadow: 0 24px 60px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    scroll-behavior: smooth;
    scroll-padding-top: 84px;
  }

  body {
    font-family: "Vazirmatn", Tahoma, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% -8%, rgba(255,210,63,.10), transparent 32%),
      radial-gradient(circle at 100% 25%, rgba(139,108,255,.14), transparent 38%),
      radial-gradient(circle at 0% 60%, rgba(139,108,255,.08), transparent 40%),
      linear-gradient(180deg, #050509, #090911 45%, #05050a);
  }

  a { color: inherit; text-decoration: none; }
  button, input, textarea, select { font-family: inherit; }
  img { max-width: 100%; display: block; }
  ul { list-style: none; }

  :focus-visible {
    outline: 2px solid var(--neon-2);
    outline-offset: 3px;
  }

  .wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  .section { padding: 64px 0; }
  .section-head { margin-bottom: 34px; }

  .section-tag {
    display: inline-block;
    direction: ltr;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .5px;
    color: var(--neon-2);
    background: rgba(139,108,255,.10);
    border: 1px solid rgba(139,108,255,.28);
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .section-head h2 {
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 900;
    line-height: 1.3;
  }

  .section-head p { margin-top: 8px; color: var(--muted); font-size: 15px; }

  /* ================= NAVBAR ================= */
  .nav {
    position: sticky;
    top: 0;
    z-index: 60;
    border-bottom: 1px solid var(--line-soft);
  }

  .nav::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: rgba(6,6,12,.72);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    height: 70px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 900;
    font-size: 19px;
    letter-spacing: .5px;
  }

  .brand .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--neon));
    box-shadow: 0 0 14px rgba(255,210,63,.6);
  }

  .brand span:last-child {
    background: linear-gradient(135deg, #fff, var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .nav-links { display: flex; align-items: center; gap: 6px; }

  .nav-links a {
    padding: 9px 16px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    transition: .25s ease;
  }

  .nav-links a:hover { color: var(--text); background: rgba(139,108,255,.10); }

  .nav-links a.nav-cta {
    padding: 10px 20px;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: #16110a;
    font-weight: 900;
  }

  .nav-links a.nav-cta:hover {
    color: #16110a;
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(255,210,63,.25);
  }

  .burger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: 0;
    cursor: pointer;
    padding: 8px;
  }

  .burger span {
    width: 24px;
    height: 2px;
    border-radius: 2px;
    background: var(--text);
    transition: .3s ease;
  }

  .burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .burger.open span:nth-child(2) { opacity: 0; }
  .burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* ================= HERO ================= */
  .hero { padding: 80px 0 40px; text-align: center; position: relative; }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(139,108,255,.10);
    border: 1px solid rgba(139,108,255,.30);
    color: var(--neon-2);
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 26px;
  }

  .hero h1 {
    font-size: clamp(42px, 10vw, 84px);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #ffffff 20%, var(--gold) 55%, var(--neon-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 30px rgba(139,108,255,.25));
  }

  .hero .tagline {
    margin: 20px auto 0;
    max-width: 560px;
    font-size: clamp(16px, 3vw, 20px);
    font-weight: 700;
    color: #e9e5f5;
  }

  .hero .desc { margin: 16px auto 0; max-width: 600px; color: var(--muted); font-size: 15px; }

  .hero-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 36px;
  }

  /* ================= BUTTONS ================= */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 15px 28px;
    border-radius: 15px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform .25s, box-shadow .25s, background .25s, border-color .25s;
    text-align: center;
    min-height: 52px;
    white-space: nowrap;
  }

  .btn:disabled { opacity: .55; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

  .btn-primary {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: #16110a;
    box-shadow: 0 12px 30px rgba(255,210,63,.18);
  }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 16px 38px rgba(255,210,63,.30); }

  .btn-neon {
    background: linear-gradient(135deg, #735cff, #9a72ff);
    color: #fff;
    box-shadow: 0 12px 30px rgba(139,108,255,.22);
  }
  .btn-neon:hover { transform: translateY(-3px); box-shadow: 0 16px 38px rgba(139,108,255,.36); }

  .btn-ghost {
    background: rgba(255,255,255,.03);
    border-color: var(--line);
    color: var(--text);
  }
  .btn-ghost:hover { transform: translateY(-3px); border-color: rgba(139,108,255,.45); background: rgba(139,108,255,.08); }

  .btn-video {
    background: rgba(139,108,255,.12);
    border-color: rgba(139,108,255,.45);
    color: var(--neon-2);
  }
  .btn-video:hover {
    transform: translateY(-3px);
    background: linear-gradient(135deg, #735cff, #9a72ff);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 14px 34px rgba(139,108,255,.32);
  }

  .btn-block { width: 100%; }

  /* ================= HERO QUICK ================= */
  .hero-quick {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin: 10px auto 30px;
    max-width: 900px;
  }

  .quick-item {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 17px 18px;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(20,20,30,.70), rgba(10,10,16,.70));
    border: 1px solid var(--line);
    box-shadow: 0 18px 40px rgba(0,0,0,.30);
    transition: transform .25s ease, border-color .25s ease;
  }

  .quick-item:hover { transform: translateY(-4px); border-color: rgba(139,108,255,.35); }

  .quick-icon {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border-radius: 13px;
    background: rgba(139,108,255,.10);
    border: 1px solid rgba(139,108,255,.20);
    font-size: 20px;
  }

  .quick-item strong { display: block; font-size: 14px; font-weight: 800; }
  .quick-item small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }

  /* ================= REVEAL ================= */
  .reveal { opacity: 0; transform: translateY(26px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }

  /* ================= GAME GRID ================= */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }

  .game-card {
    border-radius: var(--radius);
    overflow: hidden;
    background: linear-gradient(180deg, rgba(20,20,30,.80), rgba(9,9,15,.85));
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    transition: opacity .6s ease, transform .35s ease, border-color .3s ease, box-shadow .3s ease;
  }

  .game-card:hover,
  .game-card.reveal.in:hover {
    transform: translateY(-6px);
    border-color: rgba(139,108,255,.45);
    box-shadow: 0 30px 60px rgba(0,0,0,.60), 0 0 30px rgba(139,108,255,.12);
  }

  .game-thumb { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #0a0a12; }

  .game-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    transition: transform .5s ease;
  }

  .game-card:hover .game-thumb img { transform: scale(1.06); }

  .game-thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 45%, rgba(5,5,10,.85));
    pointer-events: none;
  }

  .badge-status {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    background: rgba(8,8,14,.82);
    border: 1px solid rgba(53,224,138,.40);
    color: var(--green);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .badge-status i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    animation: pulse 2s infinite;
  }

  .game-body { padding: 20px; display: flex; flex-direction: column; flex: 1; }
  .game-body h3 { font-size: 21px; font-weight: 900; }
  .game-meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }

  .chip {
    font-size: 12px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--line);
    color: var(--muted);
  }

  .chip.gold { color: var(--gold); border-color: rgba(255,210,63,.30); background: rgba(255,210,63,.06); }

  .game-desc { margin: 0 0 18px; color: var(--muted); font-size: 14px; flex: 1; }

  .game-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .game-actions .btn { padding: 12px 10px; min-height: 46px; font-size: 14px; }
  .game-actions .btn-video { grid-column: 1 / -1; }

  /* ================= COMING SOON ================= */
  .coming-soon-thumb {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 220px;
    background: radial-gradient(circle, rgba(139,108,255,.18), transparent 60%), #0a0a12;
  }

  .coming-soon-thumb::after { display: none; }

  .coming-soon-icon {
    width: 78px;
    height: 78px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 22px;
    color: var(--neon-2);
    font-size: 32px;
    background: rgba(139,108,255,.08);
    border: 1px solid rgba(139,108,255,.28);
    box-shadow: 0 0 35px rgba(139,108,255,.12);
  }

  .coming-label {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    padding: 5px 13px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    color: var(--neon-2);
    background: rgba(8,8,14,.82);
    border: 1px solid rgba(139,108,255,.30);
  }

  /* ================= LATEST ================= */
  .latest {
    position: relative;
    border-radius: 28px;
    padding: 36px;
    overflow: hidden;
    background:
      radial-gradient(circle at 100% 0%, rgba(139,108,255,.20), transparent 55%),
      radial-gradient(circle at 0% 100%, rgba(255,210,63,.13), transparent 50%),
      linear-gradient(180deg, #100f1a, #0a0a12);
    border: 1px solid rgba(139,108,255,.35);
    box-shadow: 0 30px 70px rgba(0,0,0,.55), 0 0 40px rgba(139,108,255,.08);
  }

  .latest-grid { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }

  .latest-icon {
    width: 110px;
    height: 110px;
    border-radius: 26px;
    object-fit: cover;
    object-position: center top;
    border: 2px solid rgba(255,210,63,.45);
    box-shadow: 0 0 34px rgba(255,210,63,.22);
  }

  .latest h3 { margin: 0 0 6px; font-size: clamp(22px, 4vw, 30px); font-weight: 900; }
  .latest .sub { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
  .latest-tags { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
  .latest-actions { display: flex; gap: 12px; flex-wrap: wrap; }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 800;
  }

  .tag.active { background: rgba(53,224,138,.10); color: var(--green); border: 1px solid rgba(53,224,138,.40); }
  .tag.new { background: rgba(139,108,255,.12); color: var(--neon-2); border: 1px solid rgba(139,108,255,.40); }
  .tag.gold { background: rgba(255,210,63,.08); color: var(--gold); border: 1px solid rgba(255,210,63,.32); }

  /* ================= STATUS ================= */
  .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }

  .status-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 22px;
    border-radius: var(--radius-sm);
    background: linear-gradient(180deg, var(--panel-2), #0b0b12);
    border: 1px solid var(--line);
  }

  .status-item i.led {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
    animation: pulse 2.2s infinite;
  }

  .status-item .txt strong { display: block; font-size: 16px; font-weight: 800; }
  .status-item .txt small { color: var(--muted); font-size: 13px; }

  /* ================= COPY CODE ================= */
  .copy-code-bar {
    display: flex;
    justify-content: center;
    margin: 10px 0 30px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .copy-code-btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 13px 24px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    border: 1px solid rgba(139,108,255,.45);
    background: rgba(139,108,255,.12);
    color: var(--neon-2);
    transition: .25s;
    font-family: inherit;
  }

  .copy-code-btn:hover {
    transform: translateY(-3px);
    background: linear-gradient(135deg, #735cff, #9a72ff);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 14px 34px rgba(139,108,255,.32);
  }

  .copy-code-btn.copied {
    background: linear-gradient(135deg, #22c55e, #35e08a);
    border-color: transparent;
    color: #06210f;
    transform: none;
  }

  .copy-code-btn.copied:hover {
    background: linear-gradient(135deg, #22c55e, #35e08a);
    color: #06210f;
  }

  /* کادر نمایش کد */
  .code-preview {
    display: none;
    margin: 0 auto 30px;
    max-width: 760px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #0a0a12;
  }

  .code-preview.open { display: block; }

  .code-preview-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: rgba(139,108,255,.08);
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    font-weight: 700;
    color: var(--neon-2);
    gap: 12px;
  }

  .code-preview pre {
    margin: 0;
    padding: 16px;
    max-height: 380px;
    overflow: auto;
    direction: ltr;
    text-align: left;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 12.5px;
    line-height: 1.65;
    color: #d7d0ea;
    white-space: pre;
    tab-size: 2;
  }

  .code-preview pre::-webkit-scrollbar { width: 8px; height: 8px; }
  .code-preview pre::-webkit-scrollbar-thumb {
    background: rgba(139,108,255,.35);
    border-radius: 8px;
  }
  .code-preview pre::-webkit-scrollbar-track { background: transparent; }

  /* ================= FOOTER ================= */
  .footer { border-top: 1px solid var(--line-soft); margin-top: 40px; padding: 44px 0 34px; text-align: center; }
  .footer .brand { justify-content: center; font-size: 22px; margin-bottom: 14px; }
  .footer p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }

  .socials { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 26px; }

  .socials a {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 12px 20px;
    border-radius: 14px;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--line);
    font-size: 14px;
    font-weight: 700;
    transition: .25s;
  }

  .socials a:hover { transform: translateY(-3px); border-color: rgba(139,108,255,.50); background: rgba(139,108,255,.08); }

  .copy { color: #6f6880; font-size: 13px; }

  /* ================= MODAL ================= */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(3,3,8,.80);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .modal.open { display: flex; }

  .modal-box {
    width: 100%;
    max-width: 440px;
    border-radius: 24px;
    padding: 28px;
    background: linear-gradient(180deg, #13121d, #0b0b12);
    border: 1px solid rgba(139,108,255,.35);
    box-shadow: 0 40px 90px rgba(0,0,0,.70);
    animation: pop .28s ease;
  }

  .m-top { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }

  .modal-box img {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    object-fit: cover;
    object-position: center top;
    border: 1px solid var(--line);
  }

  .modal-box h3 { font-size: 20px; font-weight: 900; }
  .m-rows { display: grid; gap: 10px; margin: 0 0 22px; }

  .m-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
    padding: 11px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--line-soft);
  }

  .m-row span { color: var(--muted); flex-shrink: 0; }
  .m-row b { font-weight: 800; }
  .m-row b.m-desc { font-weight: 500; text-align: right; line-height: 1.8; }

  /* ================= VIDEO MODAL ================= */
  .video-modal {
    position: fixed;
    inset: 0;
    z-index: 110;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(3,3,8,.90);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .video-modal.open { display: flex; }

  .video-modal-box {
    width: 100%;
    max-width: 900px;
